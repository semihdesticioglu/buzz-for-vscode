name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # runtime dependencies only: what the package ships
      - run: npm audit --omit=dev --audit-level=high
      # lint, formatting, type check, unit tests, bundle
      - run: npm run check
      # the real controller and webview against fakes of VS Code and Buzz, stress sets, timings
      - run: npm run harness
      - run: npm run coverage
        if: matrix.os == 'ubuntu-latest'
      - run: npm run package
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: '*.vsix'
