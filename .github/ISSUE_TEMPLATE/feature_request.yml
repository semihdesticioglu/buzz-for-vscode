name: Feature request
description: An idea for the extension
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What the extension could do. Mockups and examples of Buzz messages are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you tried instead, in Buzz Desktop or elsewhere.
